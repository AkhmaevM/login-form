<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="/style/style.css">
    </head>
    <body class="body">
        <form action="#" class="form">
            <h1 class="form__header">Login</h1>

            <div class="form__wrapper">
                <input type="name" placeholder="Username" class="form__input user__name">
                <input type="password" placeholder="Password"
                    class="form__input user__password">

            </div>

            <div class="form__btns">
                <a class="form__btn login__btn" href="#">Login</a>
                <a class="form__btn" href="/index.html">Don`t have account?
                    Register</a>
            </div>

            <div class="form__theme">
                <button class="form__theme-btn dark__theme">Dark</button>
                <button class="form__theme-btn light__theme">Light</button>
            </div>
        </form>

        <script src="/scripts/script.js"></script>
    </body>
</html>
