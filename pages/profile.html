<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>profile</title>
        <link rel="stylesheet" href="/style/style.css">
    </head>
    <body class="body">
        <div class="profile">
            <h1 class="profile__name"></h1>
            <p class="profile__email"></p>
            <p class="profile__phone"></p>

            <div class="form__btns">
                <button class="form__btn register__btn">Create new
                    account</button>
                <button class="form__btn login__btn">Log out</button>
            </div>

            <div class="form__theme">
                <button class="form__theme-btn dark__theme">Dark</button>
                <button class="form__theme-btn light__theme">Light</button>
            </div>
        </div>

        <script src="../scripts/profile.js"></script>
    </body>
</html>
